project:
  type: book
  output-dir: _book
  resources:
    - CNAME
  # Only written chapters are rendered; placeholders stay out of the site.
  render:
    - index.qmd
    - intro.qmd
    - foundations-signal.qmd
    - foundations-signal-typing.qmd
    - foundations-pipeline.qmd
    - cpps.qmd
    - avqi.qmd
    - abi.qmd

book:
  title: "Acoustic Measures of Voice Quality"
  subtitle: "A Living Reference"
  author:
    - name: "Jorge C. Lucero"
      affiliation: "University of Brasília"
      orcid: "0000-0003-0597-3808"
  date: today
  doi: "10.5281/zenodo.22739049"
  site-url: "https://voicemeasures.org"
  repo-url: "https://github.com/LuceroJC/voice-measures"
  repo-actions: [edit, issue]
  sidebar:
    style: docked
  page-footer:
    left: "© 2026 Jorge C. Lucero · Text: CC BY 4.0 · Code: MIT"
    right: "Built with [Quarto](https://quarto.org)"
  chapters:
    - index.qmd
    - intro.qmd
    - part: "Part I — Foundations"
      chapters:
        - foundations-signal.qmd
        - foundations-signal-typing.qmd
        - foundations-pipeline.qmd
    - part: "Part III — Noise and Harmonic Structure"
      chapters:
        - cpps.qmd
    - part: "Part IV — Composite Indices"
      chapters:
        - avqi.qmd
        - abi.qmd
    # Planned chapters are kept in the repository as placeholder .qmd files
    # but are neither listed nor rendered until written. To publish one, add
    # it here in its part AND to project.render above. Full plan:
    #   Part I:   foundations-recording, foundations-f0-detection,
    #             foundations-tasks, foundations-perceptual-anchors
    #   Part II:  f0-measures, jitter, shimmer, voice-breaks, perturbation-caveats
    #   Part III: hnr, nhr, gne, spectral-tilt
    #   Part IV:  dsi, composite-caveats
    #   Part V:   ml-landscape, ml-feature-based, ml-end-to-end
    #   Back:     appendix-adjunct-methods, appendix-reproducibility,
    #             appendix-glossary

bibliography: references.bib
lang: en

# HTML-only in CI; the runner has no LaTeX. To render a PDF locally, install
# TinyTeX (`quarto install tinytex`) and run `quarto render --to pdf`, or add
# the pdf format back here and switch the CI setup step to
# `quarto-dev/quarto-actions/setup@v2` with `tinytex: true`.
format:
  html:
    theme:
      - cosmo
      - theme.scss
    toc: true
    include-in-header: analytics.html

# freeze: auto means a document is only re-executed when it changes.
# Commit the generated _freeze/ folder so CI reuses cached results.
execute:
  freeze: auto

